name: creative-studio
services:
  db:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studio-local-demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-studio-root-local-demo}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://db:3306/studio?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: studio
      DB_PASSWORD: ${MYSQL_PASSWORD:-studio-local-demo}
      STORAGE_ROOT: /data
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      WORKER_COUNT: ${WORKER_COUNT:-2}
      QUEUE_CAPACITY: ${QUEUE_CAPACITY:-20}
      PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3100}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_IMAGE_MODEL: ${DASHSCOPE_IMAGE_MODEL:-qwen-image-2.0-pro}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
    volumes:
      - media_data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/actuator/health]
      interval: 5s
      timeout: 3s
      retries: 30
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${WEB_PORT:-3100}:3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy
  verify:
    image: node:22-bookworm-slim
    profiles: [test]
    volumes:
      - ./tests:/tests:ro
    command: [node, /tests/api-smoke.mjs]
    depends_on:
      - frontend
volumes:
  mysql_data:
  media_data:

